# Copy to e.g. my_sweep.yaml and fill in the values you want.
# CLI flags override this file: uv run sweep.py --sweep-file my_sweep.yaml

entity: munasir
project: llm-ca-evolution-real-01

# Omit configs to run every experiment YAML in configurations/
# configs:
#   - configurations/binary.yaml
#   - configurations/zelda.yaml

# 10 repeats per combination for stability.
seeds: [42, 123, 1211, 7, 91, 314, 1618, 2718, 5040, 8128]

# Only keys listed here are swept (cartesian product). Use dotted paths from --list-keys.
# 5 * 5 * 3 * 2 = 150 combinations per config, 1500 jobs per config with the seeds above.
sweep:
  ca.local_functions: [1, 3, 5, 10, 50]
  ca.global_functions: [0, 1, 3, 5, 10]
  ca.steps: [10, 25, 50]
  llm.code_context: [true]
