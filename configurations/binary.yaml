environment:
  name: "binary-v0"
  description: "a 2D binary map without borders that is fully connected and has a long path inside of it of at least 28. The values in the map have the following meanings, 0: a solid tile, 1: an empty tile."
  width: 14
  height: 14
  values: 2
  border:
    top: 0
    bottom: 0
    left: 0
    right: 0

evolution:
  population: 10
  elitism: 0.1
  crossover_rate: 0.5
  mutation_rate: 0.1
  fitness_runs: 30
  seed: 42
  generations: 100
  tournament: 3
  save_folder: "results/binary"

ca:
  steps: 10
  local_functions: 2
  size: 3
  global_functions: 1

llm:
  system_prompt: prompts/system_prompt.md
  user_function_prompt: prompts/user_function_prompt.md
  user_execute_prompt: prompts/user_execute_prompt.md
  code_context: True
  max_tokens: 1024
  model: "claude-opus-4-8"